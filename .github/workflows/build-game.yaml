name: Build Ironfall 2200 APK

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/build-game.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: game
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ironfall2200-apk
          path: game/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Rename APK
        run: cp game/app/build/outputs/apk/debug/app-debug.apk Ironfall2200.apk

      - name: Publish direct download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ironfall-latest
          name: Ironfall 2200 (versiune de test)
          body: "Descarcă **Ironfall2200.apk** de mai jos și instalează-l pe telefon."
          prerelease: true
          files: Ironfall2200.apk
