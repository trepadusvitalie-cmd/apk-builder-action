name: Build MD Chat APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["chat/**", ".github/workflows/build-chat-apk.yaml"]
  pull_request:
    paths: ["chat/**", ".github/workflows/build-chat-apk.yaml"]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Teste bază de date și token
    runs-on: ubuntu-latest # PostgreSQL este preinstalat pe această imagine
    steps:
      - uses: actions/checkout@v6

      - name: Migrări + teste RLS pe PostgreSQL temporar
        run: chat/supabase/tests/run_local.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test token LiveKit
        run: node --test chat/supabase/functions/livekit-token/token.test.ts

  android:
    name: APK Android
    runs-on: ubuntu-latest # Android SDK este preinstalat pe această imagine
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK (debug)
        working-directory: chat/android
        env:
          # Settings → Secrets and variables → Actions → Variables.
          # Fără ele APK-ul se compilează, dar afișează „Aplicația nu este configurată”.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: md-chat-debug-apk
          path: chat/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
